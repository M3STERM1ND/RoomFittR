name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 22: packages/geometry's tests are TypeScript and rely on
          # node's native type stripping, which is only on by default from 23.6.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # Build before typecheck, not after. apps/web's tsconfig includes
      # `.next/types/**/*.ts`, and those are written by `next build` -- so on
      # a clean checkout `tsc --noEmit` cannot resolve the types Next
      # generates for each route (`LayoutProps`, `PageProps`) and fails on
      # the app's own layout. Ordering it the other way means the TypeScript
      # job can only pass on a machine that happens to have built already.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # S1/S2 shell out to ffmpeg and ffprobe, and their tests synthesise real
      # clips. Installed explicitly rather than relying on the runner image:
      # what it ships has changed between Ubuntu versions, and the dev fallback
      # in `ingest._resolve` downloads a build at test time, which is not
      # something CI should depend on.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy workers eval
      - run: uv run pytest -q

  # 9.1 gates the "RLS isolation suite" on "every CI run touching DB/API",
  # and gives the reason: "Home videos are sensitive; cross-user access is the
  # worst-case bug." Its own job rather than a step in the Python one, because
  # it needs a database and the other 685 tests must not wait for one.
  #
  # The image is Supabase's own Postgres, so `auth.uid()`, the `authenticated`
  # and `anon` roles and the `vector` extension are the real ones. The suite
  # connects as `supabase_admin`: the migrations put a trigger on `auth.users`
  # and only its owner may do that. In hosted Supabase the migration role
  # already holds that right, so the password line below is a property of the
  # bare image, not of the schema.
  rls:
    name: RLS isolation suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.6.1.167
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Give the superuser a password for TCP connections
        run: |
          docker exec "$(docker ps -q --filter ancestor=public.ecr.aws/supabase/postgres:17.6.1.167)"             psql -U supabase_admin -d postgres             -c "alter role supabase_admin with password 'postgres'"
      - run: uv run pytest supabase/tests -v
        env:
          ROOMFITTR_TEST_DB_URL: postgresql://supabase_admin:postgres@localhost:55432/postgres

  # The schemas are the single definition of the four documents shared between
  # TypeScript and Python (implementation-plan.md 2.4). This job is what stops
  # the two languages drifting apart: it regenerates from the schemas and fails
  # if the committed output differs. It needs both toolchains, because the
  # Pydantic side is generated by a Python tool driven from a Node script.
  schemas-not-stale:
    name: Generated schemas are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 22: packages/geometry's tests are TypeScript and rely on
          # node's native type stripping, which is only on by default from 23.6.
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
      - run: pnpm schemas:check

  layout-rules-not-stale:
    name: Generated category rules are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 22: packages/geometry's tests are TypeScript and rely on
          # node's native type stripping, which is only on by default from 23.6.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm geometry:check

  ground-truth:
    name: Ground-truth files are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m eval.validate_ground_truth
