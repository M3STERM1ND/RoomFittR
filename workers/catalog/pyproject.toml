[project]
name = "roomfittr-catalog"
version = "0.1.0"
description = "Crawl, extract, normalize and tag the furniture catalog (implementation-plan.md 4)."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roomfittr_catalog"]

[tool.hatch.build.targets.wheel.force-include]
"roomfittr_catalog/product_rules.yaml" = "roomfittr_catalog/product_rules.yaml"
