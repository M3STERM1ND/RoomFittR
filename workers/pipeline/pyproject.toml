[project]
name = "roomfittr-pipeline"
version = "0.1.0"
description = "Video to RoomModel. The CV pipeline stages S1-S9 (implementation-plan.md 3). No Modal imports: this is a plain library so it can run locally, in CI and on any GPU host."
requires-python = ">=3.12"
dependencies = [
    "roomfittr-schemas",
    "numpy>=2.0",
    "scipy>=1.14",
    "shapely>=2.0",
    "opencv-python-headless>=4.10",
    "trimesh>=4.5",
    # Polygon triangulation for the shell mesh. trimesh needs an engine for
    # `extrude_polygon`, and earcut is the permissively licensed one (the
    # alternative, `triangle`, is not FSF-approved and 1.2 forbids shipping it).
    "mapbox-earcut>=1.0",
    "pygltflib>=1.16",
    "imageio-ffmpeg>=0.5",
    "pydantic>=2.9",
    "rtree>=1.4.1",
]

[project.optional-dependencies]
# Only the R2 backend in `storage.py` needs an AWS SDK, and it imports boto3
# lazily. Keeping it out of the base dependencies means CI and a local Tier A
# bake-off -- both of which use `LocalObjectStore` -- install neither boto3
# nor botocore.
r2 = ["boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roomfittr_pipeline"]
