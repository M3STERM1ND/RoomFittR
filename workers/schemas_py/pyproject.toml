[project]
name = "roomfittr-schemas"
version = "0.1.0"
description = "Pydantic models generated from packages/schemas/src/*.schema.json."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roomfittr_schemas"]
