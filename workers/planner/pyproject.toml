[project]
name = "roomfittr-planner"
version = "0.1.0"
description = "The Claude calls around the layout engine (implementation-plan.md 5.4 L2 and L4). The only package in the repo that talks to an LLM."
requires-python = ">=3.12"
dependencies = [
    "roomfittr-layout",
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roomfittr_planner"]
