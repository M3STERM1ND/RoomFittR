[project]
name = "roomfittr-modal"
version = "0.1.0"
description = "Thin Modal wrappers, cron and dispatch for the RoomFittr pipeline (implementation-plan.md 2.4). The pipeline itself imports no Modal; this is the only package that does."
requires-python = ">=3.12"
dependencies = [
    "roomfittr-pipeline",
    "modal>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roomfittr_modal"]
