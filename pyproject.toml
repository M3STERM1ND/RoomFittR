[project]
name = "roomfittr"
version = "0.1.0"
description = "RoomFittr: video to 3D room, furniture catalog, layout engine."
requires-python = ">=3.12"
dependencies = [
    "roomfittr-schemas",
    "roomfittr-pipeline",
    "roomfittr-layout",
    "roomfittr-planner",
    "roomfittr-catalog",
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    # Polygon IoU for E4. Listed in the approved stack (1.1 geometry utilities).
    "shapely>=2.0",
    "plyfile>=1.1.5",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    # Deploying and invoking the GPU functions is an ops task, not something
    # the pipeline or the eval harness imports. Kept in `dev` so the Modal SDK
    # does not become a runtime dependency of a package that 2.4 requires to
    # be free of it.
    "roomfittr-modal",
    # The `r2` extra on roomfittr-pipeline, pulled in for development: the eval
    # harness and the verification in `infrastructure-setup.md` both talk to
    # real R2 from this machine. It stays an extra rather than a runtime
    # dependency so CI, which has no credentials, installs neither boto3 nor
    # botocore.
    "roomfittr-pipeline[r2]",
    "datamodel-code-generator>=0.26",
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.23",
    "types-shapely>=2.1.0.20260728",
    "playwright>=1.63.0",
    "static-ffmpeg>=3.0",
    "scipy-stubs>=1.18.1.0",
    # The RLS isolation suite (9.1) talks to Postgres directly, because the
    # thing under test is the database's own access control rather than any
    # code we wrote around it.
    "psycopg[binary]>=3.2",
]

[tool.uv]
# This machine sits behind TLS interception, so uv's bundled certificate store
# rejects PyPI. Using the OS trust store fixes it here and is harmless in CI.
system-certs = true

[tool.uv.workspace]
members = [
    "workers/schemas_py",
    "workers/pipeline",
    "workers/layout",
    "workers/planner",
    "workers/catalog",
    "workers/modal_app",
]

[tool.uv.sources]
roomfittr-schemas = { workspace = true }
roomfittr-pipeline = { workspace = true }
roomfittr-layout = { workspace = true }
roomfittr-modal = { workspace = true }
roomfittr-planner = { workspace = true }
roomfittr-catalog = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by datamodel-code-generator and already ruff-formatted by it.
# Linting tool output only produces churn nobody can act on.
extend-exclude = [
    "workers/schemas_py/roomfittr_schemas",
    # Vendored skill scripts. Not ours to lint or fix.
    ".claude",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
# Two exclusions, both about module identity rather than about quality:
#
# - Generated models are checked by their own generator, not by us.
# - Every worker package has a tests/conftest.py, and pytest requires that
#   exact filename. With no __init__.py above them (deliberate: two packages
#   both named `tests` collide in mypy too) they all resolve to the module
#   `conftest`, which mypy refuses as a duplicate. The fixture factories they
#   hold are small and fail loudly at collection time; every other test file
#   stays checked, including the helper modules that carry the real logic.
exclude = '(workers/schemas_py/roomfittr_schemas/|(^|/)conftest\.py$)'

# Dev-only fallback for finding an FFmpeg binary on machines without one
# (see `ingest._resolve`). It ships no type information and is never imported
# in production, so there is nothing here worth checking.
[[tool.mypy.overrides]]
module = "imageio_ffmpeg"
ignore_missing_imports = true

# The model and storage SDKs exist only in the worker images (3.4, 3.9): torch
# and the three model packages are installed in the GPU images, boto3 only
# where R2 credentials are. Every one of them is imported inside a function so
# that this machine, CI and a CPU-only run never touch them; mypy still has to
# be told they are absent on purpose rather than missing by mistake.
[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "transformers",
    "vggt.*",
    "mapanything.*",
    "boto3",
    "botocore.*",
]
ignore_missing_imports = true

# trimesh ships no py.typed marker, so mypy reads its source and reports every
# call into it as "untyped function in typed context". Its annotations are
# incomplete and not intended for consumers; treating the package as Any is the
# honest description, and our own wrappers around it are annotated.
[[tool.mypy.overrides]]
module = "trimesh.*"
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["workers", "eval", "supabase"]
pythonpath = ["."]
