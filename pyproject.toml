[project]
name = "roomfittr"
version = "0.1.0"
description = "RoomFittr: video to 3D room, furniture catalog, layout engine."
requires-python = ">=3.11"
dependencies = [
    "roomfittr-schemas",
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    # Polygon IoU for E4. Listed in the approved stack (1.1 geometry utilities).
    "shapely>=2.0",
    "plyfile>=1.1.5",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.26",
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.23",
    "types-shapely>=2.1.0.20260728",
]

[tool.uv]
# This machine sits behind TLS interception, so uv's bundled certificate store
# rejects PyPI. Using the OS trust store fixes it here and is harmless in CI.
system-certs = true

[tool.uv.workspace]
members = ["workers/schemas_py"]

[tool.uv.sources]
roomfittr-schemas = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated by datamodel-code-generator and already ruff-formatted by it.
# Linting tool output only produces churn nobody can act on.
extend-exclude = [
    "workers/schemas_py/roomfittr_schemas",
    # Vendored skill scripts. Not ours to lint or fix.
    ".claude",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
# Generated models are checked by their own generator, not by us.
exclude = "workers/schemas_py/roomfittr_schemas/"

# numpy ships its own stubs, and from 2.3 they are written with PEP 695 `type`
# statements, which mypy only parses when python_version >= 3.12. Checking
# against 3.11 therefore dies inside numpy/__init__.pyi with a syntax error
# before it reaches our code. We never import numpy directly (it arrives via
# shapely), so skipping it costs nothing here; revisit if a worker starts
# doing real array work, at which point raising python_version is the fix.
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["workers", "eval"]
pythonpath = ["."]
